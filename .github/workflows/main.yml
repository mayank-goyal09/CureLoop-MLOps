name: MLOps Pipeline 🚀

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-train-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code 🔍
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
        lfs: true

    - name: Set up Python 🐍
      uses: actions/setup-python@v4
      with:
        python-version: "3.9"

    - name: Install Dependencies 🛠️
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Retrain Model 🧠
      run: |
        python train.py

    - name: Run Tests 🧪
      run: |
        pytest app/test_main.py

    - name: Build Docker Image 🐳
      run: |
        docker build -t medicine-app .

  # Sync to Hugging Face Hub - The "Free Alternative" Deployment
  sync-to-hub:
    needs: build-train-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
      
      - name: Push to Hugging Face Hub 🤗
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
          HF_SPACE_NAME: ${{ secrets.HF_SPACE_NAME }}
        run: |
          # 1. Sanitize Secrets (Trim whitespace/newlines)
          # This fixes the "url contains a newline" error if you copied secrets with extra spaces
          HF_TOKEN=$(echo "${{ secrets.HF_TOKEN }}" | xargs)
          HF_USERNAME=$(echo "${{ secrets.HF_USERNAME }}" | xargs)
          HF_SPACE_NAME=$(echo "${{ secrets.HF_SPACE_NAME }}" | xargs)

          # 2. Debug Checks (Secrets are masked by GitHub automatically)
          if [ -z "$HF_TOKEN" ]; then
            echo "❌ Error: HF_TOKEN secret is missing or empty."
            exit 1
          fi
          if [ -z "$HF_USERNAME" ]; then
             echo "❌ Error: HF_USERNAME secret is missing or empty."
             exit 1
          fi
          if [ -z "$HF_SPACE_NAME" ]; then
             echo "❌ Error: HF_SPACE_NAME secret is missing or empty."
             exit 1
          fi

          echo "✅ All secrets present. Preparing to push to Space: $HF_USERNAME/$HF_SPACE_NAME"

          # 3. Configure Git
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          
          # 4. Setup Remote
          # We use the token in the URL for authentication
          REMOTE_URL="https://$HF_USERNAME:$HF_TOKEN@huggingface.co/spaces/$HF_USERNAME/$HF_SPACE_NAME"
          
          git remote add space "$REMOTE_URL"
          
          # 5. Push
          echo "🚀 Pushing to Hugging Face..."
          git push --force space main:main